name: iOS checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core-and-ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: zsh scripts/test-core.sh
      - name: IPA verification boundaries
        run: python3 -m unittest discover -s scripts/tests
      - name: Swift formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests ios/MoviePilot ios/MoviePilotUITests ios/MoviePilotLayoutTests ios/MoviePilotWidgets
      - name: Build WidgetKit extension
        run: >-
          xcodebuild build
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilotWidgets
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator app and UI tests
        run: >-
          xcodebuild build-for-testing
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilot
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Adaptive navigation regression tests
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project ios/MoviePilot.xcodeproj -scheme MoviePilot \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath DerivedData \
            -only-testing:MoviePilotLayoutTests \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
